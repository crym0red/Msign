name: CLI Compatibility Harness

run-name: Compatibility ${{ inputs.job_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      requested_version:
        description: 'Test iOS ProductVersion (for example 16.2 or 26.0.1)'
        required: false
        default: ''
        type: string
      job_id:
        description: 'Optional job identifier'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect host and repository plist
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Runner ==="
          sw_vers || true
          uname -m

          echo
          echo "=== Host ProductVersion ==="
          /usr/libexec/PlistBuddy -c 'Print :ProductVersion' \
            /System/Library/CoreServices/SystemVersion.plist || true

          echo
          echo "=== Repository ProductVersion ==="
          /usr/libexec/PlistBuddy -c 'Print :ProductVersion' \
            ./SystemVersion.plist

      - name: Run compatibility shim
        id: shim
        shell: bash
        env:
          TEST_IOS_VERSION: ${{ inputs.requested_version }}
          TEST_SYSTEM_VERSION_PLIST: ./SystemVersion.plist
        run: |
          set -u

          python3 tools/version_compat_shim.py | tee compatibility-result.json
          rc=${PIPESTATUS[0]}

          echo "shim_exit_code=$rc" >> "$GITHUB_OUTPUT"

          # Keep the workflow green for unsupported test versions so the
          # diagnostic JSON and logs are still uploaded.
          exit 0

      - name: Optional baseline check of buddy3
        if: ${{ hashFiles('cli/buddy3') != '' }}
        shell: bash
        run: |
          set +e

          mkdir -p .cli-test
          cp cli/buddy3 .cli-test/buddy3
          chmod +x .cli-test/buddy3

          file .cli-test/buddy3
          codesign --verify --verbose=2 .cli-test/buddy3 2>&1 || true

          echo "This is a baseline launch only; no binary or system plist is modified."
          ./.cli-test/buddy3 --help > buddy3-stdout.txt 2> buddy3-stderr.txt
          rc=$?

          printf '%s\n' "$rc" > buddy3-exit-code.txt
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ inputs.job_id || github.run_id }}
          path: |
            compatibility-result.json
            buddy3-stdout.txt
            buddy3-stderr.txt
            buddy3-exit-code.txt
            SystemVersion.plist
          if-no-files-found: ignore
